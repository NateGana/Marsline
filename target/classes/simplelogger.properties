# Logging config for slf4j-simple.
# Keeps our own [SOURCE]/[QUEUE]/[TARGET]/[ROUTER]/[CHECKPOINT] lines visible
# at INFO level, while quieting internal Camel/ActiveMQ startup chatter so
# the console stays readable and screenshot-friendly.

org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.apache.camel=warn
org.slf4j.simpleLogger.log.org.apache.activemq=warn

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
